name: Source, documentation, and CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt numpy==1.26.4
      - run: python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
      - run: python tools/maintain.py
        env:
          OMP_NUM_THREADS: '2'
      - run: python tools/prepare_archives.py --source-only
      - name: Validate the extracted source distribution
        shell: bash
        run: |
          python -m zipfile -e release_bundles/source-only/HiSTFmamba-source.zip "$RUNNER_TEMP/source-check"
          cd "$RUNNER_TEMP/source-check/HiSTFmamba"
          python tools/maintain.py
        env:
          OMP_NUM_THREADS: '2'
